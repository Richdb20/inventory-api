
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Switch Inventory</title>
    <form th:action="@{/logout}" method="post" class="logout-form">
        <button type="submit" class="logout-button">Logout</button>
    </form>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 30px;
            color: #263238;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        h1 {
            color: #1f3a5f;
        }

        .subtitle {
            color: #607080;
            margin-bottom: 25px;
        }

        .table-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #e3e8ee;
        }

        th {
            background-color: #1f3a5f;
            color: white;
        }

        tbody tr:hover {
            background-color: #f0f5fa;
        }

        .empty-message {
            text-align: center;
            color: #607080;
            padding: 25px;
        }
        .logout-form {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 20px;
    }

    .logout-button {
    background-color: #dc2626;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    }

    .logout-button:hover {
    background-color: #b91c1c;
    }
    </style>
</head>

<body>
<div class="container">

    <h1>Switch Inventory</h1>
    <p>
        Logged in as:
        <strong th:text="${username}">Username</strong>
    </p>
    <p class="subtitle">Network switch inventory management</p>

    <div class="table-container">
        <table>
            <thead>
            <tr>
                <th>Switch ID</th>
                <th>Model</th>
                <th>Hostname</th>
                <th>Location</th>
                <th>Lifecycle</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="sw : ${switches}">
                <td th:text="${sw.switchID}">1</td>
                <td th:text="${sw.switchModel}">Cisco Catalyst</td>
                <td th:text="${sw.switchHostName}">SW-CORE-01</td>
                <td th:text="${sw.switchLocation}">Main Data Center</td>
                <td th:text="${sw.switchLifecycle}">5</td>
            </tr>

            <tr th:if="${#lists.isEmpty(switches)}">
                <td colspan="5" class="empty-message">
                    No switches found in the inventory.
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</div>
</body>
</html>
